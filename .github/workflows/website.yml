name: GBR website
on:
  pull_request:
    paths: ['_96_website/**', '.github/workflows/website.yml', '_03_review/_generation_review/_review/db.py', '_03_review/_generation_review/_review/*migration.py', '_03_review/_generation_review/_review/tags.py', '_98_database/_gbr_database/schema.sql']
  push:
    branches: [main, codex/shared-platform-database-foundation]
    paths: ['_96_website/**', '.github/workflows/website.yml', '_03_review/_generation_review/_review/db.py', '_03_review/_generation_review/_review/*migration.py', '_03_review/_generation_review/_review/tags.py', '_98_database/_gbr_database/schema.sql']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r _96_website/requirements.txt
      - run: python -m unittest discover -s _96_website/_tests -p 'test_*.py'
      - run: node --check _96_website/_analytics/analytics.js && node --check _96_website/_analytics/platform.js
      - run: node --check _96_website/releases.js && node --check _96_website/display.js && node --check _96_website/_how_its_made/making.js
      - run: python _96_website/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: gbr-website
          path: _96_website/_site
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
        with:
          path: _96_website/_site
  deploy:
    if: github.ref_name == github.event.repository.default_branch && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
