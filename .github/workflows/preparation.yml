name: GBR preparation
on:
  pull_request:
    paths: ['_04_preparation/**', '_02_generation/**', '_99_tools/_workers_processing/**', '_99_tools/_workers_comfyui/**', '_98_database/_gbr_database/**', '_03_review/_generation_review/_review/**', '.github/workflows/preparation.yml']
  push:
    branches: [main]
    paths: ['_04_preparation/**', '_02_generation/**', '_99_tools/_workers_processing/**', '_99_tools/_workers_comfyui/**', '_98_database/_gbr_database/**', '_03_review/_generation_review/_review/**', '.github/workflows/preparation.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r _03_review/_generation_review/requirements-dev.txt
      - run: python -m pytest _04_preparation/_tests -q
      - run: python -m pytest _02_generation/_tests/test_comfy_execution.py -q
      - run: node --input-type=module --check < _04_preparation/_static/preparation.js
      - run: node --input-type=module --check < _04_preparation/_static/timeline.js
      - run: node --input-type=module --check < _02_generation/_static/generation.js
