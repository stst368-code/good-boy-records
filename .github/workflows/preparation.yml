name: GBR preparation
on:
  pull_request:
    paths: ['_01_writing/_gbr_writing/**', '_01_writing/_static/**', '_01_writing/_tests/**', '_99_tools/_workers_infdit/_gbr_worker/llama.py', '_gbr_layout.py', '_04_preparation/**', '_02_generation/**', '_99_tools/_workers_processing/**', '_99_tools/_workers_comfyui/**', '_98_database/_gbr_database/**', '_03_review/_generation_review/_review/**', '.github/workflows/preparation.yml']
  push:
    branches: [main]
    paths: ['_01_writing/_gbr_writing/**', '_01_writing/_static/**', '_01_writing/_tests/**', '_99_tools/_workers_infdit/_gbr_worker/llama.py', '_gbr_layout.py', '_04_preparation/**', '_02_generation/**', '_99_tools/_workers_processing/**', '_99_tools/_workers_comfyui/**', '_98_database/_gbr_database/**', '_03_review/_generation_review/_review/**', '.github/workflows/preparation.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r _03_review/_generation_review/requirements-dev.txt
      - run: python -m pytest _01_writing/_tests _04_preparation/_tests _02_generation/_tests/test_layout.py -q
      - run: node --input-type=module --check < _01_writing/_static/writing.js
      - run: python -m pytest _02_generation/_tests -q
      - run: python -m pytest _03_review/_generation_review/_tests -q
      - run: node --input-type=module --check < _04_preparation/_static/preparation.js
      - run: node --input-type=module --check < _04_preparation/_static/timeline.js
      - run: node --input-type=module --check < _02_generation/_static/generation.js
      - run: node --input-type=module --check < _02_generation/_static/jobs.js
      - run: node --input-type=module --check < _02_generation/_static/captions.js
      - run: node --input-type=module --check < _02_generation/_static/workers.js
