lyrics: |
  [intro]
  (Woof... woof...)
  (slow) Yeah... two goldens...
  drifting... drifting...
  [verse]
  I am the golden one... copper and cold...
  Drifting through the rooms that my grumbles control...
  I don't chase the ball... no, the ball comes to me...
  Queen of every shadow, all the world is my sea...
  Earn your place, little one... bring me something sweet...
  And the floor where I'm lying is my throne you can meet...
  [chorus]
  Twooo goldens... one home in the haze...
  One drifts like a queen through her echoing days...
  One bounds like a comet, all sunlight and sound...
  Twooo golden hearts turning the world around...
  (distant) two goldens... drifting on...
  [verse]
  And the big one comes slow... like a wave on the shore...
  One thought in his mind, and that thought is no more...
  Say the word go... and he's gone... and he's lost his own name...
  Got a mouth soft as velvet and a heart full of flame...
  He loves every soul... every stranger, every friend...
  Only Teddy (why?)... and that mystery won't end...
  [chorus]
  Twooo goldens... one home in the haze...
  One drifts like a queen through her echoing days...
  One bounds like a comet, all sunlight and sound...
  Twooo golden hearts turning the world around...
  (distant) two goldens... drifting on...
  [solo]
  [bridge]
  (rising) Two sides of a golden... one heart underneath...
  She's the calm and the cunning... he's the joy and the teeth...
  One little gremlin in the swirling light...
  One slobbering comet burning soft through the night...
  (peak) Doja... Bam Bam... drifting on...
  [chorus]
  Twooo goldens... one home in the haze...
  One drifts like a queen through her echoing days...
  One bounds like a comet, all sunlight and sound...
  Twooo golden hearts turning the world around...
  (distant) two goldens... drifting on...
  [outro]
  Two goldens... one home... and we have it all...
  (fading) go on... fetch... the ball...
  Twenty twenty-six... walking on... on... on...
  (echo, gone) I'm outside now... goodbye... woof...
