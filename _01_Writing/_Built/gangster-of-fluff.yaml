  [intro]
  Hey now...
  Lassie James and Rin Tin Tin
  Marley,
  Toto,
  all the rest
  S'posed to be some bad dawgs
  Out there in the West
  But when they saw me
  And my gangster ways
  They hung up their leads
  And made dug themselves a grave [Louder ending]
  [chorus]
  Cause I'm a gangster of fluff
  Say! I'm a gangster, of, fluff
  Oh, well now
  [verse]
  When I walk down the street
  All the humans that I meet, now
  They Say
  "he's a gangster of fluff!"
  (Yeah!)
  [verse]
  I robbed a local paw-fest
  For their first place winner
  They found me and her,
  Down by the river
  (uh-huh)
  I was chasin' a ball
  Left her my steak dinner
  (that's right)
  They tried to get her to go-o
  To pick up her prize
  She just put her paws up and told them
  [bridge]
  "he's a gangster of fluff!"
  Gangster, of, fluff
  (Uuh yeah, now!)
  [verse]
  (Now back to my story now)
  When I walk in to a bar
  Girls from... from near and far
  Say: "just look how fluffy you are"
  I shake my lips, and stretch my hips
  Every human 'round feeds me my pound
  And when I slobber for more
  They bring more through the door
  Yeah
  [bridge]
  Cause I'm a gangster of fluff
  (Alright!)
  [verse]
  Now when it's time to leave home
  I barge out the back door,
  Walking on my fluff filled paws
  I search and I search
  I've found 65 balls
  I can hold them all
  Won't drop 'em if I fall
  (yeah!)
  I heard there's a hit
  A million bone reward for me
  One dark cold night
  I heard a stranger say "Is you "Bam Bam, son?"
  With a very deep voice
  I say "yes sir brother, you should know
  that's my fluff on your coat"
