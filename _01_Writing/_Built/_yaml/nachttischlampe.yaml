lyrics: |
  [intro]
  when I wake you sit before me
  standing by my side
  Nachttischlampe 
  you're before me
  occupying my mind
  Nachttischlampe
  I wouldn't say I hate you
  I just wish you had never been built
  Nachttischlampe 
  [verse]
  sitting alone by yourself
  Nachttischlampe
  I've studied, I've learned
  Ich weiß mehr als du
  I don't know how you got here
  I don't know what you do
  Ich kann’s kaum erwarten, bis du gehst
  Ich wünschte, es wäre endlich vorbei
  Time and time again I stub my toe
  your corners in my path
  Du bist mir immer im Weg
  Du hast Glück, dass du noch lebst
  I find my comfort in being unconscious around you
  Aber jeden Morgen muss ich die Augen öffnen und mich dir stellen
  [chorus]
  I should have left you on the roadside
  Nachttischlampe, Nachttischlampe
  now you're stuck here like a thorn in my side
  Nachttischlampe, Nachttischlampe 
  how does this story end
  a bonfire, a charity shop or a sledgehammer?
  whichever you choose
  make it soon
  my patience is growing thin
  Nachttischlampe, Nachttischlampe
  make your move whilst you can
  or soon I'll be moving you
  [post-chorus]
  you stand there silent
  as if you’ve done nothing wrong
  Nachttischlampe
  Du weißt genau, was du getan hast
  Nachttischlampe
  nicht mehr lange
  [verse]
  cut the cable and pull the cord
  Ich nehme dir dein Licht
  wipe your face, remove it all, leave no trace
  Du wirst im Handumdrehen vergessen sein
  your plastic veneer isn't valuable
  Du bist zu nichts anderem zu gebrauchen
  I wonder which craftsman designed you?
  Welcher Amateur hat dich zusammengebaut?
  you're bland, you're old, you've no improvement to behold
  Ich sehe keine Zukunft für uns 
  I've studied your construction
  Ich kann nichts von dir lernen 
  [pre-chorus]
  I curse at you as you drop another ball
  Ich habe nur Befehle befolgt
  that's all that you recall
  [chorus]
  I should have left you on the roadside
  Nachttischlampe, Nachttischlampe
  now you're stuck here like a thorn in my side
  Nachttischlampe, Nachttischlampe 
  how does this story end
  a bonfire, a charity shop or a sledgehammer?
  whichever you choose
  make it soon
  my patience is growing thin
  Nachttischlampe, Nachttischlampe
  make your move whilst you can
  or soon I'll be moving you
  [post-chorus]
  you stand there silent
  but now I know your game
  Nachttischlampe
  Keine Ausreden mehr
  Nachttischlampe
  deine Zeit ist vorbei
  [bridge]
  here comes the daylight
  i don't need you
  i can see just fine
  Deine Zeit ist vorbei
  kein Zweck bleibt dir
  ich hab die Sonnenschein 
  [outro]
  when I wake you won't be there
  nothing by my side
  Nachttischlampe
  no more corners
  no more light
  no more occupying my mind
  Ich kann endlich ruhig schlafen
  du bist nicht mehr da
  Nachttischlampe
  Nachttischlampe
  auf Wiedersehen
