lyrics: |
  [intro]
  mmm mmm mmm mmm
  I saw your name light up again
  Like some bad sign I should've read
  You say we're nothing, say we're friends
  Funny how that story never ends
  [verse]
  I don't need another explanation
  Don't need another late-night conversation
  You had me building something in my head
  While you were somewhere else instead
  Now I'm riding round with nowhere to be
  Cheap coffee, back seat, quarter past three
  Everybody told me what I couldn't see
  Guess the joke was always me
  [pre-chorus]
  You pull me close, then tell me go
  Make up your mind, I need to know
  One minute yes, the next minute no
  I'm already halfway down the road
  [chorus]
  Baby, take me out to California (oh)
  Drive until the morning comes (oh ho)
  You can tell me that you want me
  Then pretend that we're just having fun
  If you're leaving, keep on leaving
  If you're staying, do your thing
  I've been waiting, I've been dreaming
  I've been cutting every string
  [post-chorus]
  Your name rolls round like a mantra
  Back of a Hyundai, maybe an Lancia
  Bad behaviour, baby, I'm your karma
  Keep playing games and my girls might haunt ya
  Blueberry pancakes at a quarter to eight
  You say come over, then you make me wait
  Engine running while you change your mind
  Put it in gear, baby, don't waste my time
  [bridge]
  Do what you do
  Don't stop now
  Do what you do
  You know how
  Do what you do
  If you're gonna come through
  Don't keep me hanging
  I've got things to do
  [verse]
  Then I see you standing out with her
  Heard you call her name, fuck you Jennifer
  Suddenly every little rumour has words
  All those nights you said I was absurd
  Now the truth looks worse than what I'd heard
  So go on, tell everybody we're cool
  Tell them I'm dramatic, tell them I'm cruel
  I'll be the one that slipped through your hands
  You can keep my made up future plans
  [pre-chorus]
  I stayed awake with one eye open
  While every promise came back broken
  Now you're asking why I'm going
  Funny how you never noticed
  [chorus]
  Baby, take me out to California (oh)
  Drive until the morning comes (oh ho)
  You can tell me that you want me
  Then pretend that we're just having fun
  If you're leaving, keep on leaving
  If you're staying, do your thing
  I've been waiting, I've been dreaming
  I've been cutting every string
  [verse]
  I don't want another little fight
  I just want the truth for once tonight
  You say stay, then disappear from sight
  Baby, pick a lane and drive it right
  Maybe we could make it till tomorrow
  Maybe all we've got is borrowed
  Maybe I should pack and let it go
  You already know
  You already know
  [bridge]
  Don't stop, don't stop
  If you're gonna do it, do it
  Don't talk, don't talk
  Like there's nothing running through it
  I need somebody I can count on
  Somebody there when the lights go out
  Not another name that I obsess on
  Not another reason for doubt
  So do your thing
  I'll do mine
  You had your shot
  You had your time
  Don't reload
  A death sentence, I already got mine
  [pre-chrous]
  California in the rear-view
  Your perfume on my clothes
  I could spend another year here
  Waiting for a door you've closed
  But I'd rather be the story
  That you tell somebody new
  About the girl who finally left you
  When she figured out the truth
  [chorus]
  Baby, take yourself to California (oh)
  I don't care where you go (oh ho)
  You can tell her that you love her
  You can put on your little show
  I'm not waiting, I'm not dreaming
  I'm not hanging by a string
  You can keep your explanations
  You can go and do your thing
  [outro]
  Do your thing
  Do your thing
  Go ahead and do your thing
  California's getting smaller
  In the mirror as I leave
  Do your thing
  Do your thing
  Just don't come looking back for me
