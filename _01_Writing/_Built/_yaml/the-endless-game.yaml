inspiration: events in the world, you know what I mean, you know who I mean
inspirationyt:
story: when you let the ideals of tolerance give way to intolerant people, tolerance will be destroyed. our world is not black and white, there's a time to embrace and accept and there's a time to unite and fight.
caption: |
lyrics: |
  [intro]
  Ball!
  Ball!
  Ball!
  [verse]
  Swallowed by the endless void
  Water and current ball now destroyed
  Monoliths of nature rise
  Taking out my sphere shaped prize
  [pre-chorus]
  That ball once mine
  Along the river
  no longer fine
  I won't see it
  not once more
  Now it floats
  on that watery floor
  [chorus]
  Ripped apart, my ball it bleeds
  Feeding on the darkened void
  Crush my crown, erase the name
  Consumed inside the endless game
  [post-chorus]
  That ball I had, was the perfect size
  Fit in my mouth, my jaws on side
  [verse]
  Footballs my mouth cannot abide
  Chained in teeth, trapped inside
  Hear my declaration cry
  This ball, my mouth, will not comply
  [bridge]
  Fall. Into. The. Deep.
  The cycle ends, the waters sweep.
  Fall. From. The. Mouth.
  The water, my ball does keep.
  [pre-chorus]
  Around again, my ball has gone
  Every time, until I have none
  [chorus]
  Ripped apart, my ball it bleeds
  Feeding on the darkened void
  Crush my crown, erase the name
  Consumed inside the endless game
  [post-chorus]
  Then here comes Doja
  Her ball I lost
  What will I tell her
  Her ball I lost...
  I am afraid
  [verse]
  What heavy monster!?
  Lost my ball!?
  They think it was me?
  I cannot accept that!
  That chunky monster
  BE AFRAID!
  [bridge]
  I dive into the river
  The ball I must find
  Now I've brought my metal
  And the monster will be slayed
  [instrumental]
  [chorus]
  Ripped apart, my ball it bleeds
  Feeding on the darkened void
  Crush my crown, erase the name
  Consumed inside the endless game
  [outro]
  Erase the name!
  Consumed by!
  ...
  the endless game