caption: |
  Genre and sonic identity: extended instrumental progressive jam, tom-heavy tribal drumming, and improvisational and trippy. Emotional arc: psychedelic space rock. Rhythmic character: hypnotic slow-building groove should define the pocket and motion. Production profile: favour live in a vast empty stone amphitheatre, deep cavernous reverb, and raw analog 1970s warmth, with the mix and spatial character appropriate to the stated era. Vocal Details: Base the lead and supporting vocal treatment on wordless soaring choir-like vocals. Keep lead, backing, choir, spoken, and character roles clearly separated, and use vocal effects only where they serve the stated style. Arrangement: Follow the lyric-section timeline Intro → Verse 1 → Chorus → Verse 2 → Bridge → Outro. Section directives: Intro: echoing, distant, slow build; Verse 1: languid, stretched; Chorus: swelling, layered, hypnotic; Verse 2: drifting, building; Bridge: vast, organ swell, building to peak; Outro: dissolving into echo. Instrument lifecycle: swirling Hammond organ and atmospheric slide electric guitar drenched in tape echo should enter, recede, and return as one evolving arrangement rather than remain as a static stack. Shape transitions through changes in density, register, articulation, percussion, and ambience so the energy curve remains clearly audible. Keep melodic, harmonic, and rhythmic motifs recognisable across repeated sections, but vary orchestration and intensity enough that later returns feel developed rather than copied. Preserve natural dynamics and believable ensemble interaction, and let the arrangement breathe around the lead performance instead of filling every register continuously.
lyrics: |
  [Intro]
  (Woof... woof...)
  (slow) Yeah... two goldens...
  drifting... drifting...

  [Verse 1]
  I am the golden one... copper and cold...
  Drifting through the rooms that my grumbles control...
  I don't chase the ball... no, the ball comes to me...
  Queen of every shadow, all the world is my sea...
  Earn your place, little one... bring me something sweet...
  And the floor where I'm lying is my throne you can meet...

  [Chorus]
  Twooo goldens... one home in the haze...
  One drifts like a queen through her echoing days...
  One bounds like a comet, all sunlight and sound...
  Twooo golden hearts turning the world around...
  (distant) two goldens... drifting on...

  [Verse 2]
  And the big one comes slow... like a wave on the shore...
  One thought in his mind, and that thought is no more...
  Say the word go... and he's gone... and he's lost his own name...
  Got a mouth soft as velvet and a heart full of flame...
  He loves every soul... every stranger, every friend...
  Only Teddy (why?)... and that mystery won't end...

  [Bridge]
  (rising) Two sides of a golden... one heart underneath...
  She's the calm and the cunning... he's the joy and the teeth...
  One little gremlin in the swirling light...
  One slobbering comet burning soft through the night...
  (peak) Doja... Bam Bam... drifting on...

  [Outro]
  Two goldens... one home... and we have it all...
  (fading) go on... fetch... the ball...
  Twenty twenty-six... walking on... on... on...
  (echo, gone) I'm outside now... goodbye... woof...
