caption: |-
  Global Metadata
  Basic Attributes: bpm is 109. key is F, and scale is minor. Big Band Jazz / Swing / Musical Theatre.
  Global Emotional Progression: The piece opens with a mischievous and theatrical energy, establishing a playful yet eerie narrative tone. As the song progresses through the verses, the tension builds alongside the storytelling, leading to explosive, high-energy choruses that feel chaotic and grand. The bridge section introduces a momentary dip in intensity for dramatic emphasis before surging back into a frenetic, climactic finale that resolves with a sharp, definitive punctuation.
  Application Scenarios & Imagery: A haunted Victorian manor come to life, a theatrical stage production featuring a supernatural mystery, or a vintage cartoon chase scene involving specters.
  Sonics & Production Profile: The soundstage is wide and immersive, mimicking a live big band setup with distinct instrument placement across the stereo field. The frequency response is bright and punchy, emphasizing the attack of the brass and the snap of the snare, while maintaining a warm, resonant low end from the upright bass. The dynamic aesthetic is highly variable, shifting from intimate, breathy moments to heavily compressed, wall-of-sound sections during the full ensemble hits.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Female). The vocalist possesses a clear, powerful mezzo-soprano timbre with excellent projection and a slightly theatrical edge suitable for stage performance.
  Vocal Style: The delivery is dynamic and narrative-driven, starting with a conversational, almost conspiratorial tone in the verses. It evolves into a belting, high-energy style during the choruses, utilizing rapid phrasing and dramatic inflection to match the swing rhythm. The singer employs precise articulation and occasional vocal runs to enhance the storytelling aspect.
  Harmony/Backing Vocals: Tight, harmonized backing vocals appear primarily in the choruses and the outro, often singing in unison or close harmony to reinforce the main melody. These layers add density and a choral effect, enhancing the "ensemble" feel of the track. In the final section, repetitive vocal chants are layered to create a rhythmic, percussive texture.
  Vocal FX: The lead vocal is treated with a moderate amount of plate reverb to give it a spacious, stage-like presence without obscuring clarity. Subtle delay is occasionally used on specific phrases to accentuate the rhythmic bounce, particularly in the faster sections.
  Arrangement
  Instrument Lifecycle Description (Primary/Secondary Layering):
  Primary: A driving upright bass provides the harmonic and rhythmic foundation throughout the entire track, playing a walking bass line that anchors the swing feel. A piano acts as the core harmonic instrument, comping chords rhythmically in the verses and taking more melodic, improvisational flourishes in the instrumental breaks.
  Secondary: A full brass and woodwind section (trumpets, trombones, saxophones) enters forcefully in the choruses, delivering punchy stabs and soaring melodic lines. The drum kit, featuring a ride cymbal-heavy swing pattern, supports the groove continuously but intensifies with crash cymbals and tom fills during transitions.
  Groove & Foundation Progression: The rhythm section establishes a classic swing groove immediately, driven by the walking bass and ride cymbal pattern. The energy escalates in the choruses as the drums add more aggressive snare hits and the brass section locks into syncopated rhythms, creating a propulsive, danceable feel. The bridge sees a slight reduction in instrumentation to highlight the vocal narrative before the full ensemble returns for a high-octane finish.
  Embellishments, Textures & Spatial FX: Brass swells and woodwind glissandos serve as transitional elements between sections, adding a cinematic flair. Occasional piano runs and drum fills provide textural variety and momentum. The arrangement utilizes dynamic panning for the horn section to create a sense of movement and width, while subtle room ambience ties the ensemble together into a cohesive live-performance sound.
