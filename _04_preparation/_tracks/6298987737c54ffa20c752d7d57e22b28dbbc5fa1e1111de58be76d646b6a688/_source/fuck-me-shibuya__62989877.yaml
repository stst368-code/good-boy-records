  Groove & Foundation Progression: The rhythm section is driven by a programmed drum machine featuring a soft, thumping kick and a crisp, snappy snare/clap hybrid. The pattern is restrained in the verses, focusing on the kick and subtle hi-hats. In the choruses, the groove expands with the addition of open hi-hats and layered percussion elements, increasing the rhythmic momentum while retaining a laid-back feel.
