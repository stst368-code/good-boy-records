caption: |-
  Global Metadata
  Basic Attributes: bpm is 77. key is G, and scale is minor. Folk Rock / Blues Rock.
  Global Emotional Progression: The piece opens with a solitary, introspective mood established by sparse instrumentation, evoking a sense of lonely wandering. As the arrangement builds, the emotion shifts towards a gritty determination and raw urgency, particularly during the chorus sections where the full band enters. The track maintains this driving tension through the bridge before resolving into a lingering, atmospheric fade-out that returns to the initial contemplative state.
  Application Scenarios & Imagery: A solitary journey across a misty river at dawn, scenes of historical drama involving departure or exile, or a reflective road trip through rural landscapes under overcast skies.
  Sonics & Production Profile: The production favors an organic, live-band aesthetic with a moderately wide soundstage. The frequency response is warm and mid-range focused, highlighting the grit of the guitars and the natural resonance of the vocals. Dynamics are preserved to allow for a significant swell between the intimate verses and the louder, more aggressive choruses, avoiding excessive compression to maintain emotional impact.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male). The vocalist possesses a raspy, textured baritone with a slightly husky quality that conveys weariness and storytelling depth.
  Vocal Style: The performance begins with a restrained, narrative delivery in the verses, almost spoken-sung, emphasizing lyrical clarity. As the song progresses to the chorus, the style evolves into a powerful, belted projection with noticeable strain and grit, reflecting heightened emotional intensity. The bridge features a more desperate, pleading tone before settling back into a resigned delivery for the outro.
  Harmony/Backing Vocals: Subtle, low-register backing harmonies appear intermittently during the choruses, doubling the lead melody to add thickness and weight without creating complex counter-melodies. These layers are mixed lower than the lead to maintain focus on the primary narrative voice.
  Vocal FX: The vocal track is treated with a moderate amount of plate reverb to create a sense of space and isolation. A subtle delay is applied specifically to the ends of phrases in the verses, while the choruses feature a slightly more saturated, compressed vocal chain to enhance presence and aggression.
  Arrangement
  Instrument Lifecycle Description (Primary/Secondary Layering):
  Primary: An acoustic guitar with a bright, percussive strumming pattern serves as the harmonic backbone throughout the entire track, providing rhythmic drive and chordal structure.
  Secondary: An electric guitar with a clean-to-slightly-overdriven tone enters after the first verse, adding melodic fills and bluesy licks. This instrument becomes more prominent in the choruses, delivering sustained, distorted power chords that thicken the texture. A warm, round electric bass anchors the low end, entering subtly in the intro and locking in with the drums once the full groove establishes.
  Groove & Foundation Progression: The rhythm section initiates with a simple, laid-back drum kit pattern featuring a soft kick and brushed snare feel in the verses. Upon reaching the chorus, the percussion shifts to a solid, driving rock beat with a punchy kick and a crisp snare hit on beats 2 and 4, significantly increasing the forward momentum. The hi-hats open up during the choruses to add brightness and energy, then close down again for the bridge to create dynamic contrast.
  Embellishments, Textures & Spatial FX: Occasional slide guitar swells and harmonica-like synth textures appear in the background during instrumental breaks, adding a melancholic, folk-blues color. Cymbal crashes and tom fills are used strategically to mark transitions between sections, while a subtle ambient room tone persists throughout to enhance the "live" feel of the recording.
lyrics: |-
  [verse]
  Once upon a time at the foot of a great mountain
  There was a town where the people known as Happyfolk lived
  Their very existence a mystery to the rest of the world
  Obscured as it was by great clouds
  Here, they played out their peaceful lives
  Innocent of the litany of excess and violence
  That was growing in the world below
  To live in harmony with the spirit of the mountain called Monkey was enough
  Then one day, Strangefolk arrived in the town
  They came in camouflage, hidden behind dark glasses
  But no one noticed them, they only saw shadows
  You see, without the Truth of the Eyes, the Happyfolk were blind
  [bridge]
  Falling out of aeroplanes and hiding out in holes
  Waiting for the sunset to come, people going home
  Jump out from behind them and shoot them in the head
  Now everybody dancing the dance of the dead
  The dance of the dead, the dance of the dead
  [verse]
  In time, the Strangefolk found their way into the higher reaches of the mountain
  And it was there that they found the caves of unimaginable sincerity and beauty
  By chance, they stumbled upon the place where all good souls come to rest
  The Strangefolk, they coveted the jewels in these caves above all things
  And soon they began to mine the mountain
  Its rich seam fueling the chaos of their own world
  Meanwhile, down in the town, the Happyfolk slept restlessly
  Their dreams invaded by shadowy figures digging away at their souls
  Every day, people would wake and stare at the mountain
  Why was it bringing darkness into their lives?
  And as the Strangefolk mined deeper and deeper into the mountain, holes began to appear
  Bringing with them a cold and bitter wind that chilled the very soul of the Monkey
  For the first time, the Happyfolk felt fearful, for
  They knew that soon the Monkey would stir from its deep sleep
  And then came a sound, distant first, that grew into castrophany
  So immense that it could be heard far away in space
  There were no screams, there was no time
  The mountain called Monkey had spoken
  There was only fire, and then… nothing
  [outro]
  Oh, little town in the USA, your time has come to see
  There's nothing you believe you want
  But where were you when it all came down on me?
  Did you call me? No
