caption: |
  1970s psychedelic funk, sophisticated soul funk, disco-funk, charismatic female soul vocals, silky confident lead vocal, playful spoken character vocals, male and female call-and-response, stacked soul backing harmonies, deep syncopated electric bass, funky wah-wah guitar, clavinet groove, Rhodes electric piano, tight acoustic drums, hand percussion, punchy brass section, sweeping orchestral strings, horn stabs, bass breakdown, psychedelic phaser effects, playful stop-start arrangement, extended funk vamp, seductive groove, witty theatrical performance, warm analog tape saturation, vintage studio production, rich live instrumentation, 106 bpm
lyrics: |
  [Intro - wah-wah guitar, clavinet, deep syncopated bass]

  [Female Spoken Vocal]
  Mm.

  You can sit there.

  Not there.

  That's my spot.

  [Pitched Male Voice]
  Doja...

  [Female]
  Paws off.

  [Groove Drops]

  [Verse 1 - silky female soul vocal]
  Golden in the doorway
  Sunlight on my hair
  Everybody looking
  Like I wouldn't know they're there

  I don't need your calling
  I don't come for free
  If you want some golden loving
  Bring an offering to me

  Scratch a little higher
  Maybe to the right
  Keep it going, human
  You might earn your place tonight

  [Backing Vocals]
  Paws off!
  Unless she says so!

  [Female]
  That's right.

  [Pre-Chorus - strings and horns enter]
  I got four paws
  One crown
  Whole house
  Locked down

  If you're wondering who owns it

  Baby, look around

  [Chorus - lush female harmonies, brass hits]
  Paws off the velvet
  That's the princess's chair

  Paws off the velvet
  Don't you put your body there

  I might want attention
  I might want to be alone

  Either way the simple fact is

  Everything I see is owned

  [Backing Vocals]
  Everything!

  [Female]
  Everything.

  [Verse 2 - bass-led funk groove]
  Then I hear a rumble
  Coming down the hall
  Here comes Mister Bam Bam
  With his favourite tennis ball

  Big lips
  Wet face
  Absolutely no grace

  Hit the corner sideways
  Nearly rearranged the place

  [Bam Bam - enthusiastic male spoken vocal]
  Doja!

  [Doja]
  No.

  [Bam Bam]
  Ball?

  [Doja]
  No.

  [Bam Bam]
  Mama?

  [Doja]
  Maybe.

  [Bam Bam]
  BALL?

  [Doja]
  Good lord.

  [Horn Break]

  [Verse 2B - male/female call and response]
  [Bam Bam]
  I got love for everybody!

  [Doja]
  We know.

  [Bam Bam]
  I got places I can go!

  [Doja]
  Then go.

  [Bam Bam]
  Throw it to the garden
  I'll retrieve it through the snow!

  [Doja]
  Just don't bring Teddy.

  [Music Stops]

  [Bam Bam]
  Fluff Teddy.

  [Full Band Hit]

  [Chorus]
  Paws off the velvet
  That's the princess's chair

  Paws off the velvet
  There's enough Bam Bam everywhere

  One of us has standards
  One's a hurricane of gold

  [Backing Vocals]
  Which is which?

  [Doja]
  If you have to ask
  You're not as clever as you're told

  [Instrumental - wah guitar and clavinet trading solos]

  [Bridge - psychedelic breakdown, phaser, dreamy strings]
  [Doja - soft]
  Sometimes when the lights go down
  And everybody's sleeping
  I hear him dreaming by the door
  His giant paws still leaping

  And maybe he's an idiot
  And maybe he's obscene

  But every proper princess
  Needs a slobber-covered team

  [Backing Vocals]
  Awwww...

  [Doja]
  Don't make this weird.

  [Bass Break]

  [Final Chorus - full horns, strings, stacked soul vocals]
  Paws off the velvet
  Let the golden people through

  Paws off the velvet
  Unless I've summoned you

  Mama's got the treat bag
  Bam Bam's got the ball

  I've got every single chair
  So who's really got it all?

  [Backing Vocals]
  DOJA!

  [Doja]
  Correct.

  [Outro Vamp - bass, clavinet, wah guitar]

  Paws off
  Paws off
  P-p-p-paws off

  [Bam Bam]
  Ball!

  Paws off
  Paws off
  Keep your paws off

  [Bam Bam]
  Ball!

  [Doja]
  Somebody throw it before he explodes.

  [Backing Vocals]
  Paws off!

  [Doja]
  Woof.
