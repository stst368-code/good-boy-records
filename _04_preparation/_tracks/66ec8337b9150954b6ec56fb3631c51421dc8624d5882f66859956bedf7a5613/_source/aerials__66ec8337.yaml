caption: |-
  Global Metadata
  Basic Attributes: bpm is 167. key is Eb, and scale is minor. Blues Rock / Southern Gothic Rock.
  Global Emotional Progression: The piece opens with a somber, deliberate atmosphere that feels heavy and introspective. As the arrangement builds from the first verse into the chorus, the emotional weight transforms into a desperate, gritty plea, marked by increased vocal intensity and instrumental density. The bridge offers a moment of stripped-back resignation before surging back into a final, cathartic climax that leaves a lingering sense of melancholy resolve.
  Application Scenarios & Imagery: A solitary figure navigating a desolate landscape at twilight, scenes of internal struggle in a dimly lit study, or the soundtrack to a dramatic confrontation with one's past in a rustic setting.
  Sonics & Production Profile: The soundstage is moderately wide with a strong central focus on the vocal and rhythm section. The frequency response leans towards the mid-range warmth, giving the track an organic, slightly "dusty" character, while the low end remains tight and punchy. The dynamic aesthetic allows for significant breathing room in the verses but employs heavy compression and saturation during the choruses to create a wall-of-sound effect.
  Vocal Details
  Vocal Gender & Timbre: Singer A (Male). The vocalist possesses a deep, gravelly baritone with a distinctively raspy texture that conveys weariness and raw emotion.
  Vocal Style: The performance begins with a restrained, storytelling delivery that emphasizes lyrical clarity. As the song progresses, the style evolves into a powerful, belting technique in the choruses, utilizing vocal fry and grit to express anguish. The bridge features a softer, almost spoken-word intimacy before returning to full-throated power for the finale.
  Harmony/Backing Vocals: Layered backing vocals appear prominently in the choruses, providing thick, gospel-tinged harmonies that sit behind the lead line to amplify the anthemic quality. These harmonies are less present in the verses, allowing the lead vocal to stand alone.
  Vocal FX: The lead vocal is treated with a moderate amount of plate reverb to add space without losing intimacy. In the louder chorus sections, subtle saturation/distortion is applied to match the grit of the instrumentation, enhancing the aggressive emotional tone.
  Arrangement
  Instrument Lifecycle Description (Primary/Secondary Layering):
  Primary: An electric guitar with a clean-to-slightly-overdriven tone plays a repetitive, blues-inflected riff that serves as the harmonic backbone from the Intro through to the Outro.
  Secondary: A warm Hammond-style organ enters subtly in the first verse, swelling in volume and presence during the choruses to fill the mid-range frequencies. A distorted electric guitar layer joins in the second half, adding texture and drive during the climactic sections.
  Groove & Foundation Progression: The rhythm foundation is established by a live drum kit playing a slow, heavy shuffle beat with a prominent snare backbeat. The bass guitar locks tightly with the kick drum, providing a solid, rolling low-end pulse that remains consistent throughout, anchoring the song's slow tempo.
  Embellishments, Textures & Spatial FX: A wailing harmonica acts as a key textural element, entering during instrumental breaks and interludes to provide melodic counterpoints that heighten the bluesy atmosphere. Occasional cymbal swells and subtle room ambience are used to smooth transitions between sections, while the overall mix retains a natural, live-room feel.
