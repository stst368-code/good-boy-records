lyrics: |
  [intro]
  Lord Bam Production
  Know thy hedge
  Attend me now, and make thy pledge
  [verse]
  Take thou thy Orb
  I shall take it straight back
  I shall not cease
  I am sworn to attack
  Through thine ends
  thy yard
  thy garden
  I charge without pardon
  [verse]
  I cannot be stayed
  nor shall I beg pardon
  Not for a treat
  when an Orb lies before me
  My purpose retreats not
  my focus stands true
  Four paws to the earth
  and I thunder straight through
  [verse]
  Mine skull is of titanium
  as hard as these walls
  I smash through all before me
  beneath moon and stars
  With mine own cranium
  hear how Lord Bam roars
  Think not this matter difficult
  that Orb shall be yours no more
  That Orb is mine
  care I not where
  care I not when
  care I not who
  nor care I why
  From morning till night
  when the Orb toucheth ground
  I am ready to fight
  [verse]
  Thou throwest it once
  and the covenant is sealed
  Thou didst think it thine?
  Nay, thy claim must now yield
  The Orb leaves thy hand
  and the title is mine
  Possession is law
  and retrieval divine
  [verse]
  A fence in my path?
  Then the fence shall come down
  A gate bolted fast?
  I shall cast it to ground
  A mortal in my way?
  Well...
  thou knowest the rest
  [verse]
  Bush unto hedge
  hedge unto flowerbed
  Flowerbed unto thy head
  and behold, thou art dead
  Straight through the whole lot
  with singular devotion
  Thou thinkest me mad?
  Nay, behold my locomotion
  [verse]
  Orb.
  Orb.
  Where lies the Orb?
  Beyond yonder wall?
  Then farewell to thy wall.
  Orb.
  Orb.
  Where lies the Orb?
  Within thy hand?
  How exceedingly grand.
  Orb.
  Orb.
  Where lies the Orb?
  Drifting downriver?
  Fortune smiles,
  for I am a swimmer.
  [verse]
  No pause for reflection
  no counsel nor plan
  My course is determined
  by thy throwing hand
  Mine eyes on the prize
  I reckon its flight
  One bounce to the left
  then I cut to the right
  Wouldst thou reach down first?
  I counsel reconsideration
  I am built like a cupboard
  of formidable construction
  Yet like mine lyrical current
  I flow as the river
  Stand thou before me
  and through thee I shall thunder
  [verse]
  Hear Lord Bam roar
  as I enter the race
  Mine ears cast behind me
  with the wind on my face
  Shoulder through shrubbery
  the branches divide
  Ere thou criest out "Bam!"
  I am gone from thy side
  Orb in my jaws
  now behold my procession
  Wouldst thou have it returned?
  Come challenge possession
  Take one little step
  and I spring to attack
  Thou didst begin this game
  now thou shalt not have it back
  [outro]
  And thus am I done
  Lord Bam
  Anno Domini
  Two Thousand and Twenty-Six
  And permit me to declare...
  Peace be upon thee
