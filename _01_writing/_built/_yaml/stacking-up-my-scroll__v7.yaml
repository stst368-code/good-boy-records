lyrics: |-
  [intro]
  ("just a quick one")
  ("whilst i've got you")
  ("if you've got a sec")
  for fuck's sake!
  [verse]
  life recorded in email
  my outlook is bleak
  saint george make way
  slayed my third dragon this week
  got five plates spinning
  whilst jumping through fire
  every time i solve a problem
  they stack the pile higher
  [bridge]
  its wicked, its wicked
  my list of responsibilities is massive
  i'm i.t
  finance
  logistics
  and helpdesk
  i'm fixing
  i'm buying
  i'm shipping
  all the rest
  [pre-chorus]
  i'm so damn tired
  of hiding your fucking mess
  my arms are outstretched
  holding back the wave
  one off-hand comment
  i'm being told to behave
  let's keep it professional
  gas-lightin' me to the grave
  well here's another comment
  i've put down my arms
  no gunfire in this war
  the floodwaters wash in
  and i'll smile while you drown
  [chorus]
  (rollin')
  add another roll in
  any little favour
  stackin' up my scroll
  (rollin')
  another role to behold
  stack it up
  rack it up
  pick it up
  pack it up
  (rollin')
  don't believe me?
  open up your org chart
  and all you see is a picture of me
  [post-chorus]
  moving in silence
  i'm avoiding the bridge
  there's another problem
  just beyond the ridge
  these invisible titles
  lurking like trolls
  say the wrong thing
  they're stacking up my scroll
  [verse]
  now i'm a worker
  no doubt it's true
  the work of twenty people
  my two hands will do
  i'm the driver and the car
  i'm the horse pulling the load
  one hand on the reins
  while my feet walk the road
  i'm the engine and the fuel
  i'm the mechanic and the tool
  i'm the question and the answer
  the beginning and the end
  you're the problem, i'm the fix
  alpha and omega
  no revelation there
  [bridge]
  i'm designing, supplying, verifying, complying
  i'm reporting, supporting importing, exporting
  i'm the planner, the scanner, the spanner and hammer
  i'm the reason it's working
  my scope is infinite
  [pre-chorus]
  now if you've just got here
  then hear my advice
  keep your head down
  because every skill you show
  is another skill you'll own
  don't offer solutions
  don't show what you know
  the reward for competence
  is another a longer fucking scroll
  [chorus]
  (rollin')
  add another roll in
  any little favour
  stackin' up my scroll
  (rollin')
  another role to behold
  stack it up
  rack it up
  i'll pick it and pack it up
  (rollin')
  don't believe me?
  open up your org chart
  and all you see is a picture of me
  [verse]
  that's when i saw it
  my nightmare complete
  in the depths of the basement
  far beneath my feet
  a cabinet of records
  a corridor of stone
  a thousand dusty job descriptions
  every single one my own
  i pulled the first one open
  it was simple, it was small
  just a title and a paragraph
  barely anything at all
  but the parchment kept unfolding
  the writing kept on growing
  every task i'd ever finished
  had another one below it
  every favour, every crisis
  every
  ("could you take a look?")
  another duty in the book
  it ran across the basement
  through the stairwell, down the hall
  out the doors and through the car park
  past the windows, up the wall
  then i reached the final passage
  and i read it with a groan
  ("and any other duties as reasonably required")
  (ah fuck)
  [verse]
  you call it being flexible
  i call it stretched
  you call it taking ownership
  i call it wrecked
  you call it adding value
  i call it stress
  you keep on adding duties
  to a role you won't compress
  i've got a thousand invisible titles
  but the payslip's covers only one
  i'm the person who gets called
  when everybody else is done
  ("it's a development opportunity")
  yeah, i know the fucking score
  i've developed seventeen skills
  and you've profited from everyone single one
  you can keep your recognition
  your applause and your praise
  i don't give a fuck about your opinion
  i just want to pay the bills
  but you can't pay the fucking rent
  with a thank-you and a stacked up scroll
  [chorus]
  (rollin')
  add another roll in
  any little favour
  stackin' up my scroll
  (rollin')
  another role to behold
  stack it up
  rack it up
  i'll pick it and pack it up
  (rollin')
  don't believe me?
  open up your org chart
  and all you see is a picture of me
  [post-chorus]
  (if you're not scared, you're not working hard enough)
  what the fuck is that?
  [outro]
  ("just a quick one...")
  no
  ("whilst i've got you...")
  no
  ("if you've got a sec...")
  no!
  i'm done
  thank you for your attention to this matter
  now fuck off
