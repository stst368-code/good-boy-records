lyrics: |-
  [intro]
  "just a quick one"
  "whilst i've got you"
  "if you've got a sec"
  for fuck's sake.
  [verse]
  life recorded in email
  my outlook is bleak
  saint george make way
  alread slayed my third dragon this week
  got five plates spinning
  whilst jumping through fire
  every time i solve a problem
  they stack the pile higher
  [bridge]
  i'm i.t
  finance
  logistics
  and helpdesk
  i'm fixing
  i'm buying
  i'm shipping
  and the rest
  i'm getting
  so tired
  of hiding
  your mess
  [pre-chorus]
  my arms are outstretched
  holding back the wave
  one off-hand comment
  i'm being told to behave
  well here's a comment from my heart
  i'm putting my arms down
  no gunfire in this war
  i'll just let you drown
  [verse]
  moving in silence, i'm avoiding the bridge
  there's another problem
  hiding just beyond the ridge
  these invisible titles
  lurking like trolls
  say the wrong thing
  and they're stacking up my scroll
  [chorus]
  rollin'
  add another roll in
  any little favour
  stackin' up my scroll
  rollin'
  another role to behold
  stack it up
  rack it up
  i'll pick it and pack it up
  don't believe me?
  think i'm talking nonsense?
  open the org chart
  all you see is a picture of me
  [verse]
  now i'm a worker
  no doubt it's true
  the work of twenty people
  my hands will do
  i'm the driver and the car
  i'm the horse pulling the load
  one hand on the reins
  while my feet pave the road
  i'm the engine and the fuel
  i'm the mechanic and the tool
  i'm the question and the answer
  i'm the problem and the fix
  [bridge]
  i'm designing, supplying
  verifying and complying
  i'm reporting, supporting
  importing and exporting
  i'm the planner
  the scanner
  the spanner and the hammer
  i'm the reason it's working
  no task out of scope in the name of the king
  [pre-chorus]
  hear my advice
  keep your head down
  every skill you show
  is a skill you'll own
  don't offer solutions
  don't show what you know
  the reward for competence
  is another fucking scroll
  [chorus]
  rollin'
  add another roll in
  any little favour
  stackin' up my scroll
  rollin'
  another role to behold
  stack it up
  rack it up
  i'll pick it and pack it up
  don't believe me?
  think i'm talking nonsense?
  open the org chart
  all you see is a picture of me
  [verse]
  that's when i saw it
  my nightmare complete
  in the depths of the basement
  far beneath my feet
  a cabinet of records
  a corridor of stone
  a thousand dusty job descriptions
  every single one my own
  i pulled the first one open
  it was simple, it was small
  just a title and a paragraph
  barely anything at all
  but the parchment kept unfolding
  and the writing started growing
  every task i'd ever finished
  had another one below it
  every favour, every crisis
  every "could you take a look?"
  every time i said "i'll handle it"
  another duty in the book
  it ran across the basement
  through the stairwell, down the hall
  out the doors and through the car park
  past the windows, up the wall
  then i reached the final passage
  and i read it with a groan
  "and any other duties
  as reasonably required"
  reasonably?
  you absolute bastards.
  [verse]
  you call it being flexible
  i call it being stretched
  you call it taking ownership
  i call it being wrecked
  you call it adding value
  i call it adding stress
  you keep on adding duties
  to a role you won't assess
  i've got a thousand little titles
  but the payslip's got just one
  i'm the person who gets called
  when everybody else is done
  "it's a development opportunity"
  yeah, i know the fucking score
  i've developed seventeen skills
  and you've developed seventeen more
  you can keep your recognition
  your applause and your praise
  you can't pay the fucking mortgage
  with a thank-you and a raise—
  ...of expectations.
  [chorus]
  rollin'
  add another roll in
  any little favour
  stackin' up my scroll
  rollin'
  another role to behold
  stack it up
  rack it up
  i'll pick it and pack it up
  don't believe me?
  think i'm talking nonsense?
  open the org chart
  all you see is a picture of me
  no promotion
  expectation of manic devotion
  a thousand different titles
  and not a penny of compensation
  rollin'
  the scroll keeps rollin'
  one wrong word
  and the scroll's back in motion
  [outro]
  "just a quick one..."
  no
  "whilst i've got you..."
  no
  "if you've got a sec..."
  oh, for fuck's sake.
